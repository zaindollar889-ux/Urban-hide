<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Urban Hide Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>:root{--cream:#f4efe6;--cream2:#ece5d7;--ink:#15130f;--ink2:#1d1a15;--red:#d9342b;--red2:#a91f19;--gold:#e0a339;--gold2:#c4902f;--mute:#6f6a60;--line:#ddd5c6;--card:#fff;--r:14px}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--cream);color:var(--ink);font:400 16px/1.65 Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom,0)}
h1,h2,h3,h4{font-family:'Playfair Display',Georgia,serif;font-weight:500;line-height:1.08;margin:0}
h1{font-size:clamp(2.5rem,9vw,4.8rem);letter-spacing:-.02em}
h2{font-size:clamp(1.9rem,5.6vw,3rem);letter-spacing:-.015em}
h1 em,h2 em,h3 em{color:var(--red);font-weight:500}
.dark h1 em,.dark h2 em,.dark h3 em,.hero h1 em{color:var(--gold)}
a{color:inherit;text-decoration:none}
img{max-width:100%;height:auto}
:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.dark :focus-visible,.hero :focus-visible,.ft :focus-visible{outline-color:var(--gold)}
.skip{position:absolute;left:-999px;top:8px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;z-index:100}
.skip:focus{left:8px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
section{padding:72px 0}
.eye{display:flex;align-items:center;gap:10px;color:var(--red);font-size:.68rem;font-weight:800;letter-spacing:.2em;text-transform:uppercase;margin-bottom:14px}
.eye::before{content:'';width:26px;height:1px;background:currentColor}
.eye.c{justify-content:center}.eye.c::before{display:none}
.dark .eye,.hero .eye{color:var(--gold)}
.sub{color:var(--mute);margin:14px 0 30px;max-width:56ch}
.dark .sub{color:#b9b1a2}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 24px;border-radius:99px;font:700 .85rem Manrope,sans-serif;letter-spacing:.02em;border:1px solid var(--ink);background:none;color:var(--ink);cursor:pointer;transition:transform .15s,box-shadow .2s,background .2s,color .2s;min-height:46px}
.btn:hover{transform:translateY(-1px)}.btn:active{transform:scale(.97)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 10px 22px rgba(217,52,43,.28)}
.btn.red:hover{background:var(--red2);border-color:var(--red2)}
.btn.blk{background:var(--ink);color:#fff}
.btn.wht{background:#fff;border-color:#fff;color:var(--ink)}
.btn.ghost-w{border-color:rgba(255,255,255,.55);color:#fff}
.btn.ghost-w:hover{background:rgba(255,255,255,.1)}
.btn.wa-b{background:#1faa57;border-color:#1faa57;color:#fff}
.btn.sm-btn{padding:9px 18px;min-height:40px;font-size:.78rem}
.ib{width:18px;height:18px;flex:none}
.row{display:flex;gap:10px;flex-wrap:wrap}
/* top ticker */
.top{background:var(--ink);color:#d9d2c4;font-size:.66rem;letter-spacing:.08em;padding:8px 0;overflow:hidden;white-space:nowrap}
.tk{display:inline-flex;gap:44px;padding-left:44px;animation:tk 45s linear infinite;will-change:transform}
.tk span.g{color:var(--gold);font-weight:700;letter-spacing:.12em;text-transform:uppercase}
@keyframes tk{to{transform:translateX(-50%)}}
/* header */
.hd{position:sticky;top:0;z-index:30;background:rgba(244,239,230,.94);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hd::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.nav{display:flex;align-items:center;justify-content:space-between;height:68px;gap:18px}
.logo{display:flex;align-items:center;gap:10px}
.logo img{height:38px;width:auto;display:block}
.logo b{font:800 .78rem Manrope;letter-spacing:.3em}
.dnav{display:none;gap:30px;margin-left:auto}
.dnav a{font-size:.82rem;font-weight:700;padding:6px 0;position:relative}
.dnav a::after{content:'';position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--gold);transform:scaleX(0);transform-origin:left;transition:transform .25s}
.dnav a:hover::after,.dnav a[aria-current]::after{transform:scaleX(1)}
.hide-m{display:none}
.burger{width:44px;height:44px;background:none;border:0;display:grid;place-content:center;gap:5px;cursor:pointer}
.burger i{display:block;width:22px;height:2px;background:var(--ink);transition:transform .25s,opacity .2s}
.burger[aria-expanded=true] i:nth-child(1){transform:translateY(7px) rotate(45deg)}
.burger[aria-expanded=true] i:nth-child(2){opacity:0}
.burger[aria-expanded=true] i:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
.menu{display:none;background:var(--cream);border-top:1px solid var(--line)}
.menu.open{display:block}
.menu a{display:block;padding:15px 20px;border-bottom:1px solid var(--line);font-weight:700}
.menu .mq{color:var(--red)}
/* hero */
.hero{background:radial-gradient(ellipse at 78% 30%,rgba(224,163,57,.2),transparent 55%),repeating-linear-gradient(135deg,rgba(224,163,57,.045) 0 2px,transparent 2px 16px),var(--ink);color:#f2eee5;padding:56px 0 64px;overflow:hidden}
.hero .g{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
.hero p{color:#c9c1b2;margin:20px 0 26px;max-width:46ch;font-size:1.02rem}
.stats{display:flex;gap:32px;margin-top:34px;flex-wrap:wrap}
.stats div{font-size:.7rem;color:#b9b1a2;letter-spacing:.04em}
.stats b{display:block;font:600 1.9rem 'Playfair Display',serif;color:#fff;line-height:1.1}
.frame{position:relative;border:1px solid rgba(224,163,57,.45);outline:1px solid rgba(224,163,57,.18);outline-offset:9px;border-radius:6px;padding:52px 26px 78px;background:radial-gradient(circle at 50% 38%,#2c241a 0,#14110d 68%);box-shadow:0 30px 60px rgba(0,0,0,.45);display:grid;place-items:center}
.frame>img{width:100%;max-width:340px;filter:drop-shadow(0 10px 30px rgba(224,163,57,.18))}
.pill{position:absolute;top:14px;left:14px;background:var(--red);color:#fff;border-radius:99px;font-size:.55rem;font-weight:800;letter-spacing:.16em;padding:6px 12px;text-transform:uppercase}
.note{position:absolute;right:-8px;bottom:-26px;background:#fff;color:var(--mute);border-radius:10px;padding:10px 12px;font-size:.68rem;line-height:1.4;width:150px;box-shadow:0 10px 24px rgba(0,0,0,.35)}
.note b{display:block;color:var(--ink);font-size:.76rem}
.strip{background:var(--ink2);overflow:hidden;white-space:nowrap;padding:16px 0;border-top:1px solid #2c2923}
.strip div{display:inline-block;padding-left:100%;animation:sl 50s linear infinite;font:italic 500 1.05rem 'Playfair Display',serif;color:#e9e2d4}
.strip span{margin:0 24px}.strip span::before{content:'•';color:var(--gold);margin-right:24px;font-style:normal}
@keyframes sl{to{transform:translateX(-100%)}}
/* what we do */
.six{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{background:linear-gradient(180deg,#fff,#fbf9f4);border:1px solid var(--line);border-radius:var(--r);padding:24px 22px;transition:transform .25s,box-shadow .25s,border-color .25s}
.card:hover{transform:translateY(-4px);box-shadow:0 16px 32px rgba(21,19,15,.1);border-color:var(--gold)}
.card small{color:var(--gold2);font-weight:800;font-size:.7rem;letter-spacing:.14em}
.card h3{font:600 1.2rem 'Playfair Display',serif;margin:8px 0 6px}
.card p{margin:0;font-size:.88rem;color:var(--mute);line-height:1.55}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.tile{position:relative;border-radius:var(--r);min-height:260px;padding:20px;display:flex;flex-direction:column;justify-content:flex-end;color:#fff;overflow:hidden;background-image:linear-gradient(0deg,rgba(0,0,0,.82),rgba(0,0,0,.05) 72%),repeating-linear-gradient(45deg,rgba(255,255,255,.045) 0 2px,transparent 2px 7px);transition:transform .3s,box-shadow .3s}
.tile:hover{transform:translateY(-5px);box-shadow:0 20px 38px rgba(21,19,15,.28)}
.tile::after{content:"";position:absolute;left:20px;right:20px;top:0;height:2px;background:linear-gradient(90deg,var(--gold),transparent)}
.tic{position:absolute;top:22px;left:50%;width:96px;height:96px;transform:translateX(-50%);color:var(--gold);opacity:.9;transition:transform .35s}
.tile:hover .tic{transform:translateX(-50%) scale(1.08)}
.tile small{font-size:.58rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:800}
.tile h3{font:600 1.25rem 'Playfair Display',serif;margin:4px 0 8px;color:#fff}
.tile span{font-size:.74rem;font-weight:700;opacity:.9}
.c0{background-color:#6b4526}.c1{background-color:#1c1c1e}.c2{background-color:#8a5a33}.c3{background-color:#5a2a2c}.c4{background-color:#3d4a5c}.c5{background-color:#2b2622}.c6{background-color:#2c3e5a}
/* dark section */
.dark{background:radial-gradient(circle at 90% 0,#2a231a 0,var(--ink) 55%);color:#f2eee5}
.steps{list-style:none;padding:0;margin:0 0 34px;display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.steps li{border-top:1px solid #3a3226;padding-top:18px}
.steps b{font:600 1.8rem 'Playfair Display',serif;color:var(--gold)}
.steps h3{font:600 1.1rem 'Playfair Display',serif;margin:8px 0 6px;color:#fff}
.steps p{margin:0;font-size:.86rem;color:#b9b1a2}
.stat4{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid #38342d;border-radius:var(--r)}
.stat4 div{padding:22px 10px;text-align:center;border-right:1px solid #38342d;font-size:.72rem;color:#b9b1a2}
.stat4 div:last-child{border:0}
.stat4 b{display:block;font:600 1.9rem 'Playfair Display',serif;color:var(--gold)}
/* countries */
.ctry{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ctry div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:.86rem;font-weight:700}
.ctry small{display:block;color:var(--mute);font-weight:500;font-size:.72rem}
/* faq */
.faq{max-width:780px;margin:0 auto}
.faq h2{text-align:center;margin-bottom:26px}
details{border-bottom:1px solid var(--line);padding:18px 0}
summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:14px;font:600 1.05rem 'Playfair Display',serif}
summary::-webkit-details-marker{display:none}
summary::after{content:'+';width:26px;height:26px;border:1px solid var(--ink);border-radius:50%;display:grid;place-items:center;flex:none;font:400 1.1rem Manrope;transition:transform .25s,background .2s}
details[open] summary::after{content:'−';background:var(--ink);color:#fff}
details p{margin:12px 0 0;color:var(--mute);font-size:.94rem}
/* get in touch */
.getin{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:20px;padding:40px}
.cards{display:flex;flex-direction:column;gap:12px}
.cc{display:flex;align-items:center;gap:14px;background:var(--cream);border:1px solid var(--line);border-radius:12px;padding:16px 18px;transition:border-color .2s,transform .2s}
a.cc:hover{border-color:var(--gold);transform:translateX(3px)}
.cci{width:26px;height:26px;flex:none;color:var(--red)}
.cc span{flex:1;font-weight:700;font-size:.96rem;word-break:break-word}
.cc small{display:block;color:var(--mute);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
.cc i{font:italic 600 1.2rem 'Playfair Display',serif;color:var(--gold2)}
/* CTA */
.cta{background:linear-gradient(135deg,#d9342b,#a91f19);color:#fff;border-radius:20px;padding:44px 32px;margin:0 0 24px;position:relative;overflow:hidden}
.cta::after{content:'';position:absolute;right:-60px;top:-60px;width:220px;height:220px;border:1px solid rgba(255,255,255,.25);border-radius:50%}
.cta h2 em{color:#fff;font-style:italic}
.cta p{opacity:.92;margin:12px 0 22px}
/* product pages */
.ph{background:radial-gradient(circle at 85% 0,#2a231a 0,#15130f 60%);color:#fff;padding:44px 0 0}
.ph::after{content:"";display:block;height:2px;margin-top:38px;background:linear-gradient(90deg,var(--gold),transparent 60%)}
.ph h1{font-size:clamp(2.3rem,8vw,3.8rem)}
.crumb{font-size:.72rem;color:#a89f8f;margin-bottom:14px}
.crumb a:hover{color:var(--gold)}
.pg{display:grid;grid-template-columns:.9fr 1.1fr;gap:40px;align-items:start}
.pimg{position:relative;overflow:hidden;border-radius:var(--r);min-height:360px;border:1px solid #3a3226;background-image:linear-gradient(0deg,rgba(0,0,0,.4),transparent),repeating-linear-gradient(45deg,rgba(255,255,255,.05) 0 2px,transparent 2px 7px);display:grid;place-items:center}
.pimg::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 42%,rgba(224,163,57,.24),transparent 62%)}
.pic{position:relative;z-index:1;width:170px;height:170px;color:var(--gold);filter:drop-shadow(0 8px 20px rgba(0,0,0,.5))}
.pimg>img{position:absolute;left:16px;top:16px;width:64px;height:auto;z-index:1;opacity:.9}
.pimg small{position:absolute;bottom:16px;left:0;right:0;text-align:center;z-index:1;color:#d6c8b0;font-size:.62rem;letter-spacing:.26em;text-transform:uppercase}
.ck{list-style:none;padding:0;margin:16px 0 24px}
.ck li{padding:7px 0 7px 28px;position:relative;font-size:.96rem}
.ck li::before{content:'✓';position:absolute;left:0;color:var(--red);font-weight:800}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:30px 0 0}
.chips span{border:1px solid var(--line);border-radius:99px;font-size:.74rem;padding:6px 14px;color:var(--mute);font-weight:600}
.chips span:first-child{background:var(--red);border-color:var(--red);color:#fff}
.tw{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;max-width:600px}
.tw h3{margin:0 0 12px;font:600 1.05rem 'Playfair Display',serif}
.ts{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.86rem;min-width:320px}
th{background:var(--ink);color:#fff;padding:9px 10px;text-align:left;font-weight:700}
td{padding:9px 10px;border-bottom:1px solid var(--line)}
tr:nth-child(even) td{background:#f7f4ec}
/* forms */
.box{background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:grid;gap:5px;font-size:.66rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-bottom:12px}
input,select,textarea{font:500 .96rem Manrope;padding:12px 13px;border:1px solid var(--line);border-radius:10px;background:var(--cream);width:100%;color:var(--ink);letter-spacing:0;text-transform:none}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:var(--gold)}
textarea{min-height:100px;resize:vertical}
.err{color:var(--red2);font-weight:700;font-size:.85rem;margin:0 0 12px}
.fine{font-size:.74rem;color:var(--mute);margin:12px 0 0}
input.bad,select.bad,textarea.bad{border-color:var(--red);background:#fdf0ee}
/* footer */
.ft{background:var(--ink);color:#b9b1a2;padding:56px 0 34px;font-size:.88rem;margin-top:30px}
.ft .g{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:34px}
.ft img{height:auto;width:170px;margin-bottom:12px}
.ft p{margin:0 0 16px}
.ft h5{margin:0 0 12px;color:#fff;font-size:.68rem;letter-spacing:.18em;text-transform:uppercase}
.ft a:not(.btn){display:block;padding:4px 0}.ft a:not(.btn):hover{color:var(--gold)}
.ft .g span{display:block;padding:4px 0}
.ft .cp{border-top:1px solid #2c2923;margin-top:34px;padding-top:18px;font-size:.74rem}
/* modal */
.md{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:60;display:none;align-items:flex-end;justify-content:center}
.md.open{display:flex}
.sheet{background:var(--cream);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:24px 20px calc(24px + env(safe-area-inset-bottom,0px));max-height:94vh;overflow:auto;animation:up .3s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet h3{font-size:1.9rem;margin-bottom:4px}
.sh{display:flex;align-items:center;gap:10px;margin-bottom:14px}.sh img{height:34px;width:auto}.sh b{font:800 .72rem Manrope;letter-spacing:.28em}
.x{float:right;background:none;border:0;font-size:2rem;cursor:pointer;line-height:1;width:44px;height:44px;margin:-8px -10px 0 0}
.wa{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:#25d366;display:grid;place-items:center;z-index:40;box-shadow:0 8px 22px rgba(0,0,0,.35);transition:transform .2s}
.wa:hover{transform:scale(1.07)}
.wai{width:30px;height:30px;color:#fff}
/* reveal */
.js .rv{opacity:0;transform:translateY(22px);transition:opacity .7s ease,transform .7s ease}
.js .rv.in{opacity:1;transform:none}
/* responsive */
@media(min-width:900px){.dnav{display:flex}.burger{display:none}.hide-m{display:inline-flex}.menu,.menu.open{display:none}.tiles{grid-template-columns:repeat(4,1fr)}.tile{min-height:340px}.md{align-items:center}.sheet{border-radius:22px}}
@media(max-width:899px){.hero .g{grid-template-columns:1fr}.hero .hv{order:-1;max-width:380px;margin:0 auto;width:100%;padding-bottom:30px}.getin{grid-template-columns:1fr;padding:26px 20px}.pg{grid-template-columns:1fr}.steps{grid-template-columns:1fr 1fr}.pimg{min-height:300px}}
@media(max-width:620px){table{min-width:0;font-size:.78rem}th,td{padding:8px 6px}.hero .hv{padding-bottom:34px}section{padding:54px 0}.six{grid-template-columns:1fr 1fr}.ctry{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}.ft .g{grid-template-columns:1fr 1fr}.ft .g>div:first-child{grid-column:1/-1}.stat4{grid-template-columns:1fr 1fr}.stat4 div:nth-child(2){border-right:0}.stat4 div:nth-child(-n+2){border-bottom:1px solid #38342d}.note{right:0;width:140px}.tile{min-height:230px;padding:16px}.tic{width:78px;height:78px}.cta{padding:32px 22px}.tw{padding:12px}}
@media(max-width:380px){.six{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.tk,.strip div{animation:none}.strip div{padding-left:0}html{scroll-behavior:auto}.js .rv{opacity:1;transform:none;transition:none}.sheet{animation:none}}
/* ===== v2: new hero, arrivals, gallery, about, product photos ===== */
.hero2{position:relative;background:radial-gradient(ellipse at 78% 22%,rgba(224,163,57,.17),transparent 55%),repeating-linear-gradient(135deg,rgba(224,163,57,.035) 0 2px,transparent 2px 18px),#0f0d0a;color:#f2eee5;padding:64px 0 84px;overflow:hidden}
.hero2 .wm{position:absolute;right:-6%;top:50%;transform:translateY(-50%);width:min(64vw,680px);height:auto;opacity:.07;pointer-events:none}
.hg{display:grid;grid-template-columns:1.05fr .95fr;gap:52px;align-items:center;position:relative}
.hero2 h1{color:#fff}.hero2 h1 em{color:var(--gold)}
.hero2 .ht>p{color:#c9c1b2;margin:20px 0 26px;max-width:46ch;font-size:1.04rem}
.hero2 .eye{color:var(--gold)}
.coll{position:relative;aspect-ratio:1/1.04;max-width:540px;width:100%;justify-self:end}
.coll figure{position:absolute;margin:0;border:1px solid rgba(224,163,57,.45);border-radius:8px;overflow:hidden;box-shadow:0 26px 54px rgba(0,0,0,.6);background:#111}
.coll figure img{width:100%;height:100%;object-fit:cover;display:block}
.coll .c1{left:0;top:0;width:58%;height:80%}
.coll .c2{right:0;top:9%;width:45%;height:33%}
.coll .c3{right:5%;bottom:0;width:41%;height:41%}
.coll .bdg{position:absolute;left:40%;bottom:-2%;width:104px;height:104px;z-index:2;animation:spin 48s linear infinite;filter:drop-shadow(0 8px 16px rgba(0,0,0,.6))}
@keyframes spin{to{transform:rotate(360deg)}}
.coll.solo{display:grid;place-items:center;border:1px solid rgba(224,163,57,.4);border-radius:8px;padding:40px;aspect-ratio:auto;background:radial-gradient(circle at 50% 40%,#2c241a,#14110d)}
.coll.solo img{width:100%;max-width:360px}
/* tiles with photo */
.tile.has-img::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(0deg,rgba(0,0,0,.86),rgba(0,0,0,.06) 70%)}
.tile .tbg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;transition:transform .5s}
.tile:hover .tbg{transform:scale(1.05)}
.tile>small,.tile>h3,.tile>span{position:relative;z-index:2}
.tile.has-img::after{z-index:2}
